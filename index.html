    text-align: center;

  .logo-wrap {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid var(--kraft);
    box-shadow: 0 4px 20px var(--sombra);
    margin-bottom: 1.8rem;
    background: white;

  .logo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 2rem;
    color: white;

    line-height: 1.2;
    margin-bottom: 0.5rem;
  }

  .tagline {
    font-size: 1rem;
    color: var(--morado);
    font-style: italic;
    margin-bottom: 2.5rem;
    font-family: 'Playfair Display', serif;
  }

  .lang-title {
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--kraft);
    margin-bottom: 1rem;
    font-weight: 600;
  }

  .lang-buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .lang-btn {
    padding: 0.75rem 2rem;
    border: 2px solid var(--verde);
    background: transparent;
    color: var(--marron);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .lang-btn:hover, .lang-btn:focus {
    background: var(--verde);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(158,169,84,0.35);
    outline: none;
  }

  /* PANTALLA PRINCIPAL */
  #main-screen { display: none; }

  .header {
    background: linear-gradient(135deg, var(--verde) 0%, var(--morado) 100%);
    padding: 2rem 1.5rem 3rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 40px;
    background: var(--kraft-palido);
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  .header-logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    overflow: hidden;
    margin: 0 auto 1rem;
    background: white;
  }

  .header-logo img { width: 100%; height: 100%; object-fit: cover; }

  .header h1 {
    color: white;
    font-size: clamp(1.4rem, 4vw, 2rem);
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .header .tagline { color: rgba(255,255,255,0.85); margin-bottom: 0; }

  /* BARRA DE PROGRESO */
  .progress-wrap {
    max-width: 600px;
    margin: 2rem auto 0;
    padding: 0 1.5rem;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--kraft);
    margin-bottom: 0.4rem;
    font-weight: 600;
  }

  .progress-bar {
    height: 8px;
    background: var(--kraft-claro);
    border-radius: 50px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--verde), var(--morado));
    border-radius: 50px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* TARJETA DE PREGUNTA */
  .question-card {
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1.2rem;
  }

  .card {
    background: var(--blanco);
    border-radius: 20px;
    padding: 2rem 1.8rem;
    box-shadow: 0 6px 30px var(--sombra);
    border: 1.5px solid var(--kraft-claro);
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--verde), var(--morado));
    border-radius: 20px 20px 0 0;
  }

  .question-num {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--morado-claro);
    letter-spacing: 0.08em;
    margin-bottom: 0.8rem;
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    color: var(--marron);
    line-height: 1.5;
    margin-bottom: 1.8rem;
  }

    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 1rem 1.2rem;
    border: 2px solid var(--kraft-claro);
    background: var(--kraft-palido);
    border-radius: 14px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    color: var(--marron);
    transition: all 0.2s ease;
    line-height: 1.4;
  }

  .option-btn:hover, .option-btn:focus {
    border-color: var(--verde);
    background: rgba(158,169,84,0.1);
    transform: translateX(4px);
    outline: none;
  }

  .option-btn.selected {
    border-color: var(--morado);
    background: rgba(146,105,173,0.1);
  }

  .option-letter {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--verde-claro);
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    line-height: 22px;
    margin-right: 0.6rem;
    flex-shrink: 0;
  }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
    gap: 1rem;
  }

  .btn-nav {
    padding: 0.7rem 1.8rem;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 2px solid transparent;
  }

  .btn-prev {
    background: transparent;
    border-color: var(--kraft);
    color: var(--kraft);
  }

  .btn-prev:hover { background: var(--kraft-claro); }

  .btn-next {
    background: linear-gradient(135deg, var(--verde), var(--morado));
    color: white;
    border: none;
    box-shadow: 0 4px 14px rgba(146,105,173,0.35);
  }

  #results-screen {

    max-width: 700px;
    margin: 0 auto;
    padding: 2rem 1.2rem 4rem;

    margin-bottom: 2.5rem;

  .results-header h2 {

  .result-card {

  .result-name {

    font-weight: 600;
    color: var(--marron);
    margin-bottom: 0.2rem;

    font-size: 0.78rem;
    color: var(--morado);
    margin-bottom: 0.5rem;
    font-style: italic;

    font-size: 0.88rem;
    color: #6b5040;
    line-height: 1.5;
  }

  .result-score {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--verde);
    margin-top: 0.4rem;

    display: block;

    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;

    align-items: center;
    gap: 0.8rem;
    margin: 1.5rem 0;
    color: var(--kraft);
    font-size: 0.9rem;

    height: 1px;
    background: var(--kraft-claro);

  @media (max-width: 480px) {
    .result-card { flex-wrap: wrap; }
    .result-rank { width: 100%; height: 40px; }
    .result-img, .result-img-placeholder { width: 100%; height: 120px; }
    .nav-buttons { flex-direction: column-reverse; }
    .btn-nav { width: 100%; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; transform: none !important; }
  }
</style>
</head>

<div id="results-screen">

  <button class="btn-restart" id="btn-restart" onclick="restartTest()">↺ Repetir o test</button>
  <p class="footer-brand">Feito con mans e corazón · Pezzzeta</p>
</div>

// ============================================================
let lingua = 'gl';
let preguntaActual = 0;
let respostas = {};
let puntuacions = {};

const textos = {
  gl: {
    testTitle: "Test de Fragancias",
    testSubtitle: "Descobre o teu aroma Pezzzeta",
    pregunta: "Pregunta",
    de: "de",
    anterior: "← Anterior",
    seguinte: "Seguinte →",
    ver: "Ver os meus resultados ✿",
    resultsTitle: "Os teus aromas Pezzzeta",

    puntos: "puntos",
    repetir: "↺ Repetir o test",
    notasLabel: "Notas:",
    footer: "Feito con mans e corazón · Pezzzeta"
  },
  es: {
    testTitle: "Test de Fragancias",
    testSubtitle: "Descubre tu aroma Pezzzeta",
    pregunta: "Pregunta",
    de: "de",
    anterior: "← Anterior",
    seguinte: "Siguiente →",
    ver: "Ver mis resultados ✿",
    resultsTitle: "Tus aromas Pezzzeta",
    resultsSubtitle: "Estas son las 5 fragancias que mejor te van",
    puntos: "puntos",
    repetir: "↺ Repetir el test",
    notasLabel: "Notas:",
    footer: "Hecho con manos y corazón · Pezzzeta"
  },
  en: {
    testTitle: "Fragrance Quiz",
    testSubtitle: "Discover your Pezzzeta scent",
    pregunta: "Question",
    de: "of",
    anterior: "← Back",
    seguinte: "Next →",
    ver: "See my results ✿",
    resultsTitle: "Your Pezzzeta scents",
    resultsSubtitle: "These are the 5 fragrances that suit you best",
    puntos: "points",
    repetir: "↺ Take the quiz again",
    notasLabel: "Notes:",
    footer: "Made with hands and heart · Pezzzeta"
  }
};

function startTest(lang) {
  lingua = lang;
  document.getElementById('lang-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  const t = textos[lang];
  document.getElementById('test-title').textContent = t.testTitle;
  document.getElementById('test-subtitle').textContent = t.testSubtitle;
  document.getElementById('btn-prev').textContent = t.anterior;
  preguntaActual = 0;
  respostas = {};
  puntuacins = {};
  Object.keys(fragancias).forEach(k => puntuacins[k] = 0);
  mostrarPregunta();
}

function mostrarPregunta() {
  const t = textos[lingua];
  const total = preguntas.length;
  const idx = preguntaActual;
  const p = preguntas[idx];
  const pct = Math.round((idx / total) * 100);

  document.getElementById('progress-text').textContent = `${t.pregunta} ${idx + 1} ${t.de} ${total}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-num').textContent = `${t.pregunta} ${idx + 1} / ${total}`;
  document.getElementById('q-text').textContent = p.texto[lingua];

  const lista = document.getElementById('options-list');
  lista.innerHTML = '';
  p.opcions.forEach((op, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (respostas[idx] === i ? ' selected' : '');
    btn.innerHTML = `<span class="option-letter">${op.letra}</span>${op.texto[lingua]}`;
    btn.onclick = () => seleccionarOpcion(i);
    lista.appendChild(btn);
  });

  document.getElementById('btn-prev').style.visibility = idx === 0 ? 'hidden' : 'visible';
  const btnNext = document.getElementById('btn-next');
  const esUltima = idx === total - 1;
  btnNext.textContent = esUltima ? textos[lingua].ver : textos[lingua].seguinte;
  btnNext.disabled = respostas[idx] === undefined;
}

function seleccionarOpcion(i) {
  respostas[preguntaActual] = i;
  document.querySelectorAll('.option-btn').forEach((b, idx) => {
    b.classList.toggle('selected', idx === i);
  });
  document.getElementById('btn-next').disabled = false;
}

function prevQuestion() {
  if (preguntaActual > 0) { preguntaActual--; mostrarPregunta(); }
}

function nextQuestion() {
  const total = preguntas.length;
  if (preguntaActual < total - 1) {
    preguntaActual++;
    mostrarPregunta();
  } else {
    calcularResultados();
  }
}

function calcularResultados() {
  const scores = {};
  Object.keys(fragancias).forEach(k => scores[k] = 0);

  preguntas.forEach((p, qi) => {
    const sel = respostas[qi];
    if (sel === undefined) return;
    const op = p.opcions[sel];
    Object.entries(op.puntos).forEach(([frag, pts]) => {
      if (scores[frag] !== undefined) scores[frag] += pts;
    });
  });

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 5);
  mostrarResultados(sorted);
}

function mostrarResultados(top5) {
  document.getElementById('main-screen').style.display = 'none';
  const rs = document.getElementById('results-screen');
  rs.style.display = 'block';
  const t = textos[lingua];
  document.getElementById('results-title').textContent = t.resultsTitle;
  document.getElementById('results-subtitle').textContent = t.resultsSubtitle;
  document.getElementById('btn-restart').textContent = t.repetir;
  document.querySelector('.footer-brand').textContent = t.footer;

  const lista = document.getElementById('results-list');
  lista.innerHTML = '';
  const rankLabels = ['1✦', '2', '3', '4', '5'];
  const rankClasses = ['rank-1','rank-2','rank-3','rank-4','rank-5'];

  top5.forEach(([key, score], i) => {
    const f = fragancias[key];
    if (!f) return;
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-rank ${rankClasses[i]}">${rankLabels[i]}</div>
      <div class="result-img-placeholder">${f.emoji}</div>
      <div class="result-info">
        <div class="result-name">${f.nome[lingua]}</div>
        <div class="result-notes">${t.notasLabel} ${f.notas[lingua]}</div>
        <div class="result-desc">${f.desc[lingua]}</div>
        <div class="result-score">${score} ${t.puntos}</div>
      </div>`;
    lista.appendChild(card);
  });

  rs.scrollIntoView({ behavior: 'smooth' });
}

function restartTest() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('lang-screen').style.display = 'flex';
  preguntaActual = 0;
  respostas = {};
}
</script>
